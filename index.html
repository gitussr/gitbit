<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="GitBit — Git, one bit at a time. A mental-model-first Git learning and reference PWA." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GitBit" />
    <title>GitBit — Git, one bit at a time.</title>
    <!-- Theme before first paint. Mirrors src/services/theme.ts (storage key,
         light default, "system" following the OS, theme-color values) —
         change both together. -->
    <script>
      try {
        // v2: the old dark mode's `gitbit-theme` (default "system") must not count as a choice.
        localStorage.removeItem('gitbit-theme')
        var p = localStorage.getItem('gitbit-theme-v2')
        if (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14150d')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
